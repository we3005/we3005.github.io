<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio</title>
    <style>
        :root {
            --bg-color: #f2f2f2; 
            --card-color: #c8d8e4; 
            --text-main: #38647f;  
            --text-muted: #4a778d; 
            --accent: #75a3ad;  
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Lucida Console,Lucida Sans Typewriter,monaco,Bitstream Vera Sans Mono,monospace; 
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            padding: 2rem 1rem;
        }

        /* Container to center everything nicely */
        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        /* Header Section */
        header {
            text-align: center;
            margin-bottom: 3rem;
            padding: 2rem 0;
            border-bottom: 1px solid var(--card-color);
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            color: var(--accent);
            font-size: 1.2rem;
            font-weight: 500;
        }

        /* Section Layouts */
        section {
            margin-bottom: 3rem;
        }

        h2 {
            font-size: 1.5rem;
            margin-bottom: 1rem;
            color: var(--text-main);
            border-left: 4px solid var(--accent);
            padding-left: 10px;
        }

        p {
            color: var(--text-muted);
            margin-bottom: 1rem;
        }

        /* Dynamic Grid for Projects or Skills */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            margin-top: 1rem;
        }

        /* Styled Cards */
        .card {
            background-color: var(--card-color);
            padding: 1.5rem;
            border-radius: 8px;
            border: 1px solid #334155;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            border-color: var(--accent);
        }

        .card h3 {
            margin-bottom: 0.5rem;
            color: var(--text-main);
        }

        /* Action Buttons / Links */
        .btn {
            display: inline-block;
            background-color: var(--accent);
            color: var(--bg-color);
            padding: 0.5rem 1rem;
            border-radius: 4px;
            text-decoration: none;
            font-weight: bold;
            margin-top: 1rem;
            font-size: 0.9rem;
        }

        .btn:hover {
            opacity: 0.9;
        }

        /* Badges for Skills */
        .badge-container {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .badge {
            background-color: #dee9ec;
            color: var(--accent);
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
        }
        /* Contact Section Button Layout */
        .contact-links {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            margin-top: 1.5rem;
        }
        
        .contact-btn {
            margin-top: 0; /* Overrides the default layout margin */
            padding: 0.75rem 1.5rem;
            text-align: center;
            min-width: 130px;
            transition: background-color 0.2s ease, transform 0.2s ease;
        }
        
        .contact-btn:hover {
            transform: translateY(-2px);
            background-color: var(--text-main);
            color: var(--bg-color);
        }
        
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Wes H.</h1>
            <p class="subtitle"> Computer Science + Mathematics Major @ UofT/Full-Stack Developer
        </header>
    </div>
</body>
</html>
